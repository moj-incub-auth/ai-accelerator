apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config-app-of-apps
  namespace: openshift-gitops
  labels:
    gitops.ownedBy: cluster-config
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: cluster-config
  source:
    path: clusters/overlays/rhoai-stable-2.25
    repoURL: https://github.com/moj-incub-auth/ai-accelerator.git
    targetRevision: primary
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
