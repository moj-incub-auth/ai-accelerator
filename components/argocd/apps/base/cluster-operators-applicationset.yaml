apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-operators
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  generators:
    - list:
        elements:
#          - patch-me-see-overlays
        - cluster: local
          url: https://kubernetes.default.svc
          values:
            name: user-workload-monitoring
            path: components/cluster-configs/user-workload-monitoring/overlays/default
  template:
    metadata:
      name: '{{values.name}}'
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: Prune=false
      labels:
        gitops: operator
    spec:
      project: cluster-config
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 20m
      source:
#        repoURL: patch-me-see-clusters-overlays
#        targetRevision: patch-me-see-clusters-overlays
        repoURL: https://github.com/moj-incub-auth/ai-accelerator.git
        targetRevision: primary
        path: '{{values.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops
