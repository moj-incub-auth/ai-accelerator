apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-machineset-job
  namespace: openshift-machine-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-machineset-job
rules:
  - apiGroups: ["machine.openshift.io"]
    resources: ["machinesets"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["autoscaling.openshift.io"]
    resources: ["machineautoscalers"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aws-creds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-machineset-job
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-machineset-job
subjects:
  - kind: ServiceAccount
    name: infra-machineset-job
    namespace: openshift-machine-api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: infra-machineset-setup
  namespace: openshift-machine-api
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: infra-machineset-job
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash", "/scripts/job.sh"]
          env:
            - name: INSTANCE_TYPE
              value: m6a.xlarge
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: infra-machineset-scripts
            defaultMode: 0755
