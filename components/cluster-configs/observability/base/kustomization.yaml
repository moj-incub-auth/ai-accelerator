---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: moj-observability

resources:
  - grafana-deployment.yaml
  - grafana-datasources.yaml
  - grafana-dashboards-provider.yaml
  - service-monitor-vllm.yaml
  - service-monitor-search-api.yaml
  - prometheus-rules.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/vllm-dashboard.json
      - dashboards/moj-search-dashboard.json
