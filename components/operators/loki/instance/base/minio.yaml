apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-minio
  namespace: openshift-logging
  labels:
    app: loki-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-minio
  template:
    metadata:
      labels:
        app: loki-minio
    spec:
      nodeSelector:
        node-role.kubernetes.io/infra: ""
      tolerations:
        - key: node-role.kubernetes.io/infra
          effect: NoSchedule
          operator: Exists
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: loki
            - name: MINIO_ROOT_PASSWORD
              value: lokisecret
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: loki-minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-minio-data
  namespace: openshift-logging
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki-minio
  namespace: openshift-logging
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: api
  selector:
    app: loki-minio
